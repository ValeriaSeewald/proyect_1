<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/gh/methio/adafruitIO-class@latest/index.js"></script>
    <script src="script.js" defer></script>

    <!-- load p5 libraries -->
     <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>

    <link rel="stylesheet" href="style.css" />
    
</head>

<body>

    <div class="dashboard-card">
    
        <div class="tabs-container">
            <button class="tab-btn active">Living Room</button>
            <button class="tab-btn green">Beedroom</button>
            <button class="tab-btn green">Kitchen</button>
            <button class="tab-btn green add-btn">+</button>
        </div>

       
        <div class="main-content">
        
            <!-- rectangle on the left-->
            <div class="panel-card blue-card">
                <div class="panel-row">
                    <h3 class="label-bold">Sensor Light Level</h3>
                    <div class="badge badge-large">
                        <span id="sensorLightLevel">--</span>%
                    </div>
                </div>
                
                <div class="panel-row">
                    <span class="label-regular">Ideal Light Level</span>
                    <!-- Input tipo número editable dinámicamente -->
                    <div class="badge badge-small">
                        <span contenteditable="true" id="gradValueDisplay">--</span>%
                    </div>
                </div>
            </div>

            <!-- rectangle on the right -->
            <div class="panel-card blue-card switch-panel">
                <h3 class="panel-title">Automatic Graduation</h3>
                
                <div class="switch-container">
                    <span class="switch-label" id="labelOn">OFF</span>
                
                    <label class="toggle-switch">
                    <input type="checkbox" id="graduationToggle" checked />
                    <span class="slider"></span>
                    </label>
                
                    <span class="switch-label" id="labelOff">ON</span>
                </div>
            </div>
        </div>

        <main></main>
    </div>


</body>
</html>
